baseURL: https://spikezhang.me/
defaultContentLanguage: zh
hasCJKLanguage: true
title: Spike Zhang
theme: PaperMod

languages:
  zh:
    direction: ltr
    label: 简体中文
    locale: zh-CN
    weight: 1

menu:
  main:
    - identifier: posts
      name: 博客
      url: /posts/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20

taxonomies:
  tag: tags

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  minifyOutput: true

params:
  env: production
  title: Spike Zhang
  description: Spike Zhang 的个人博客，记录产品、设计、音乐与生活。
  keywords: [产品, 设计, 音乐, 生活]
  author: Spike Zhang
  DateFormat: 2006-01-02
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  label:
    text: Spike Zhang

  assets:
    favicon: favicon.svg
    favicon16x16: favicon.svg
    favicon32x32: favicon.svg
    apple_touch_icon: favicon.svg
    safari_pinned_tab: favicon.svg

  homeInfoParams:
    Title: Hi, 这里是 Spike。
    Content: |
      我是 Spike。

      喜欢创造、设计和音乐，在这里记录生活、工作与学习。

  socialIcons:
    - name: x
      url: https://x.com/spikezhangx
    - name: github
      url: https://github.com/natsustan
    - name: rss
      url: /index.xml

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
